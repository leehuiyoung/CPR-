<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>심폐소생술(CPR) 스마트 시뮬레이션</title>
    <style>
        /* 메인 컬러 및 기본 설정 (메디컬 블루 & 세이프티 그린) */
        :root {
            --primary-color: #2563EB;
            --primary-light: #EFF6FF;
            --success-color: #10B981;
            --danger-color: #EF4444;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --bg-color: #F8FAFC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #E2E8F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 앱 컨테이너 (태블릿/스마트폰 반응형) */
        #app {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 800px) {
            #app {
                height: 90vh;
                border-radius: 16px;
            }
        }

        /* 상단 헤더 & 진행률 바 */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 16px;
            text-align: center;
        }

        header h1 {
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .step-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            color: rgba(255,255,255,0.5);
            transition: 0.3s;
        }

        .step-indicator.active {
            color: white;
        }

        .step-indicator.done {
            color: var(--success-color);
        }

        /* 중앙 일러스트 영역 */
        .stage-area {
            flex: 1;
            background-color: var(--primary-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* 마네킹(환자) 일러스트 CSS 디자인 */
        .mannequin {
            width: 120px;
            height: 200px;
            position: relative;
            transition: 0.5s;
        }

        .head {
            width: 60px;
            height: 70px;
            background-color: #E2E8F0;
            border-radius: 40% 40% 50% 50%;
            margin: 0 auto;
            border: 3px solid #CBD5E1;
        }

        .torso {
            width: 110px;
            height: 120px;
            background-color: #E2E8F0;
            border-radius: 30% 30% 20% 20%;
            margin: 5px auto 0;
            border: 3px solid #CBD5E1;
            position: relative;
        }

        /* AED 패치 위치 표시 (숨겨져 있다가 특정 단계에서 나타남) */
        .aed-pad {
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #FBBF24;
            border: 2px solid #D97706;
            border-radius: 4px;
            display: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .pad-right-collar { top: 15px; left: 10px; }
        .pad-left-rib { bottom: 20px; right: 10px; }

        .stage-message {
            margin-top: 20px;
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: 600;
            text-align: center;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 하단 지시문 및 버튼 영역 */
        .interaction-area {
            background-color: white;
            padding: 24px;
            border-top: 2px solid #F1F5F9;
        }

        .instruction-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background-color: white;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            word-break: keep-all;
            line-height: 1.3;
        }

        .choice-btn::before {
            content: '👆';
            margin-right: 12px;
            font-size: 1.2rem;
        }

        .choice-btn:hover {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
        }

        .choice-btn:active {
            transform: scale(0.98);
        }

        /* 피드백 모달 (정답/오답) */
        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .feedback-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .feedback-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .feedback-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .feedback-desc {
            font-size: 1.1rem;
            color: var(--text-sub);
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
            word-break: keep-all;
        }

        .next-btn {
            margin-top: 24px;
            padding: 12px 32px;
            font-size: 1.1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
            }
        .pulse { animation: pulse 1s infinite; }
    </style>
</head>
<body>

<div id="app">
    <!-- 상단 헤더 -->
    <header>
        <h1>[보건] 심폐소생술(CPR) 스마트 시뮬레이션</h1>
        <div class="progress-bar">
            <span class="step-indicator" id="nav-1">❶ 의식확인</span> ➔
            <span class="step-indicator" id="nav-2">❷ 119신고</span> ➔
            <span class="step-indicator" id="nav-3">❸ CPR</span> ➔
            <span class="step-indicator" id="nav-4">❹ AED사용</span>
        </div>
    </header>

    <!-- 중앙 일러스트 영역 -->
    <div class="stage-area">
        <div class="mannequin" id="mannequin">
            <div class="head"></div>
            <div class="torso">
                <div class="aed-pad pad-right-collar" id="pad1"></div>
                <div class="aed-pad pad-left-rib" id="pad2"></div>
            </div>
        </div>
        <div class="stage-message" id="stage-msg">시나리오를 시작합니다...</div>
    </div>

    <!-- 하단 상호작용 영역 -->
    <div class="interaction-area">
        <div class="instruction-text" id="instruction">질문이 이곳에 표시됩니다.</div>
        <div class="choices" id="choices-container">
            <!-- 버튼이 자바스크립트를 통해 동적으로 생성됩니다 -->
        </div>
    </div>

    <!-- 피드백 팝업 -->
    <div class="feedback-overlay" id="feedback">
        <div class="feedback-icon" id="feedback-icon">✔️</div>
        <div class="feedback-title" id="feedback-title">정답입니다!</div>
        <div class="feedback-desc" id="feedback-desc">설명이 이곳에 표시됩니다.</div>
        <button class="next-btn" id="next-btn" onclick="goToNextStep()">다음 단계로</button>
    </div>
</div>

<script>
    // 시나리오 데이터 정의 (문제, 정답, 오답, 피드백 등)
    const scenarioData = [
        {
            navIndex: 1,
            stageMsg: "응급 환자 발견!",
            instruction: "환자가 쓰러져 있습니다. 가장 먼저 해야 할 행동은 무엇일까요?",
            choices: [
                { text: "어깨를 가볍게 두드리며 괜찮은지 묻는다.", isCorrect: true, feedback: "현장 안전을 확인한 후, 환자의 어깨를 두드리며 의식을 확인하는 것이 첫 번째 단계입니다." },
                { text: "몸을 강하게 흔들고 뺨을 때려 의식을 깨운다.", isCorrect: false, feedback: "환자의 몸을 강하게 흔들면 경추(목뼈) 손상이 올 수 있으므로 절대 해선 안 됩니다!" }
            ]
        },
        {
            navIndex: 2,
            stageMsg: "환자 의식 및 호흡 없음",
            instruction: "의식이 없고 정상적인 호흡이 없습니다. 주변 사람에게 도움을 요청하세요!",
            choices: [
                { text: "거기 안경 쓴 남학생, 119에 신고해 주고 자동심장충격기 가져다주세요!", isCorrect: true, feedback: "특정 사람의 특징을 명확히 지목하여 역할(119 신고, AED 가져오기)을 분담하는 것이 정확한 대처입니다." },
                { text: "누구든 제발 빨리 119에 전화 좀 해주세요!", isCorrect: false, feedback: "불특정 다수에게 요청하면 '방관자 효과'로 인해 아무도 신고하지 않을 수 있습니다. 특정인을 지목해야 합니다!" }
            ]
        },
        {
            navIndex: 3,
            stageMsg: "가슴 압박 준비",
            instruction: "도움 요청을 마쳤습니다. 가슴 압박을 시작해야 합니다. 두 손을 깍지 끼고 올릴 정확한 압박 위치는?",
            choices: [
                { text: "가슴뼈(흉골) 아래쪽 절반", isCorrect: true, feedback: "정확합니다! 가슴뼈의 아래쪽 절반 부위에 손꿈치를 대고 수직으로 깊고 강하게 압박해야 합니다." },
                { text: "가슴 정중앙 또는 명치 부근", isCorrect: false, feedback: "명치를 누르면 장기 파열의 위험이 있습니다. 가슴뼈(흉골) 아래쪽 절반을 압박해야 합니다." }
            ]
        },
        {
            navIndex: 3,
            stageMsg: "가슴 압박 실시 중",
            instruction: "가슴 압박과 인공호흡을 병행하려고 합니다. 올바른 횟수 비율은 어떻게 될까요?",
            choices: [
                { text: "가슴 압박 30회, 인공호흡 2회 (30:2)", isCorrect: true, feedback: "분당 100~120회의 속도로 5cm 깊이로 가슴 압박 30회를 한 후, 인공호흡 2회를 실시하는 것이 기본 원칙입니다." },
                { text: "가슴 압박 15회, 인공호흡 1회 (15:1)", isCorrect: false, feedback: "성인 심폐소생술의 권장 비율은 가슴 압박 30회 대 인공호흡 2회 (30:2) 입니다." }
            ]
        },
        {
            navIndex: 4,
            stageMsg: "AED 도착",
            instruction: "요청했던 자동심장충격기(AED)가 도착했습니다. 박스를 열고 가장 먼저 해야 할 일은?",
            choices: [
                { text: "가장 먼저 AED의 전원 버튼을 누른다.", isCorrect: true, feedback: "아주 중요합니다! AED 사용의 첫 단계는 무조건 기기의 '전원 켜기'입니다. 이후 음성 지시를 따르면 됩니다." },
                { text: "환자의 가슴에 두 개의 패치를 먼저 부착한다.", isCorrect: false, feedback: "전원을 켜야 기기가 음성 안내를 시작합니다. 반드시 전원부터 켜야 합니다!" }
            ]
        },
        {
            navIndex: 4,
            stageMsg: "AED 패치 부착 지시",
            instruction: "전원이 켜졌습니다. 환자의 가슴에 두 개의 패치를 부착할 올바른 위치는 어디일까요?",
            action: "showPads", // 특별 애니메이션 발동
            choices: [
                { text: "우측 빗장뼈(쇄골) 아래와 좌측 젖꼭지 아래 중간겨드랑선", isCorrect: true, feedback: "정확한 위치입니다! 패치에 그려진 그림을 참고하여 심장을 사이에 두도록 대각선으로 부착합니다." },
                { text: "양쪽 가슴 정중앙에 나란히 부착", isCorrect: false, feedback: "심장에 전류를 효과적으로 통과시키기 위해서는 우측 쇄골 아래와 좌측 옆구리(겨드랑이 아래) 쪽에 부착해야 합니다." }
            ]
        },
        {
            navIndex: 4,
            stageMsg: "심전도 리듬 분석",
            instruction: "패치 부착 후 기기가 '환자의 심전도를 분석합니다' 라고 음성 안내를 합니다. 이때 해야 할 행동은?",
            choices: [
                { text: "환자의 몸에서 손을 떼고 '모두 물러나세요!' 라고 외친다.", isCorrect: true, feedback: "리듬 분석 중에 환자를 만지고 있으면 구조자의 심전도가 섞여 잘못 분석될 수 있으므로 접촉을 피해야 합니다." },
                { text: "분석하는 동안 멈추지 않고 가슴 압박을 계속한다.", isCorrect: false, feedback: "가슴 압박을 계속하면 심전도 분석에 오류가 발생합니다. 분석 중에는 반드시 환자에게서 떨어져야 합니다!" }
            ]
        },
        {
            navIndex: 4,
            stageMsg: "심장 충격 지시",
            instruction: "기기에서 '심장 충격이 필요합니다'라며 충격 버튼이 깜빡입니다. 충격 버튼을 누른 직후 해야 할 일은?",
            choices: [
                { text: "지체 없이 즉시 가슴 압박(CPR)을 다시 시작한다.", isCorrect: true, feedback: "훌륭합니다! 심장 충격 직후 심장이 정상 리듬을 찾을 때까지 바로 가슴 압박을 재개하여 혈액을 순환시켜야 합니다." },
                { text: "환자가 깨어날 때까지 가만히 환자의 상태를 지켜본다.", isCorrect: false, feedback: "충격 후 심장이 바로 뛰지 않을 수 있습니다. 기기의 다음 지시가 있을 때까지 즉시 가슴 압박을 다시 시작해야 합니다!" }
            ]
        }
    ];

    let currentStep = 0;
    let score = 0;

    // DOM 요소 가져오기
    const instructionEl = document.getElementById('instruction');
    const choicesContainer = document.getElementById('choices-container');
    const stageMsgEl = document.getElementById('stage-msg');
    const feedbackOverlay = document.getElementById('feedback');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackDesc = document.getElementById('feedback-desc');
    const mannequin = document.getElementById('mannequin');

    // UI 업데이트 함수
    function loadStep() {
        if (currentStep >= scenarioData.length) {
            showFinalResult();
            return;
        }

        const data = scenarioData[currentStep];
        
        // 상단 네비게이션 색상 업데이트
        updateNav(data.navIndex);

        // 텍스트 업데이트
        stageMsgEl.textContent = data.stageMsg;
        instructionEl.textContent = data.instruction;

        // 특수 액션 (AED 패치)
        if(data.action === "showPads") {
            stageMsgEl.classList.add('pulse');
        } else {
            stageMsgEl.classList.remove('pulse');
            document.getElementById('pad1').style.display = 'none';
            document.getElementById('pad2').style.display = 'none';
            document.getElementById('pad1').style.opacity = '0';
            document.getElementById('pad2').style.opacity = '0';
        }

        // 버튼 렌더링
        choicesContainer.innerHTML = '';
        
        // 선택지 랜덤 섞기
        const shuffledChoices = [...data.choices].sort(() => Math.random() - 0.5);

        shuffledChoices.forEach((choice) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = choice.text;
            btn.onclick = () => handleChoice(choice, btn);
            choicesContainer.appendChild(btn);
        });
    }

    // 상단 진행바 업데이트
    function updateNav(activeIndex) {
        for(let i=1; i<=4; i++) {
            const nav = document.getElementById('nav-' + i);
            if (i < activeIndex) {
                nav.className = 'step-indicator done';
            } else if (i === activeIndex) {
                nav.className = 'step-indicator active';
            } else {
                nav.className = 'step-indicator';
            }
        }
    }

    // 선택 버튼 클릭 시 처리
    function handleChoice(choice, btnElement) {
        const isLastStep = currentStep === scenarioData.length - 1;
        
        if (choice.isCorrect) {
            score++;
            btnElement.style.borderColor = "var(--success-color)";
            btnElement.style.backgroundColor = "#ECFDF5";
            showFeedback(true, choice.feedback, isLastStep);
            
            // AED 패치 부착 정답 시 일러스트에 패치 등장
            if(scenarioData[currentStep].action === "showPads") {
                const pad1 = document.getElementById('pad1');
                const pad2 = document.getElementById('pad2');
                pad1.style.display = 'block';
                pad2.style.display = 'block';
                setTimeout(() => {
                    pad1.style.opacity = '1';
                    pad2.style.opacity = '1';
                }, 100);
            }

        } else {
            btnElement.style.borderColor = "var(--danger-color)";
            btnElement.style.backgroundColor = "#FEF2F2";
            btnElement.classList.add('shake');
            setTimeout(() => btnElement.classList.remove('shake'), 400);
            showFeedback(false, choice.feedback, false);
        }
    }

    // 피드백 팝업 표시
    function showFeedback(isCorrect, desc, isLastStep) {
        feedbackOverlay.classList.add('show');
        
        if (isCorrect) {
            feedbackIcon.textContent = "🟢";
            feedbackTitle.textContent = "정확합니다!";
            feedbackTitle.style.color = "var(--success-color)";
            document.getElementById('next-btn').textContent = isLastStep ? "결과 보기" : "다음 단계로";
            // 정답일 때만 다음 스텝으로 넘어갈 수 있도록 세팅
            document.getElementById('next-btn').onclick = goToNextStep;
        } else {
            feedbackIcon.textContent = "❌";
            feedbackTitle.textContent = "다시 생각해 보세요!";
            feedbackTitle.style.color = "var(--danger-color)";
            document.getElementById('next-btn').textContent = "다시 시도하기";
            // 오답일 때는 팝업만 닫고 다시 풀도록 세팅
            document.getElementById('next-btn').onclick = closeFeedback;
        }
        feedbackDesc.textContent = desc;
    }

    // 피드백 팝업 닫기 (오답 시)
    function closeFeedback() {
        feedbackOverlay.classList.remove('show');
    }

    // 다음 문제로 넘어가기 (정답 시)
    function goToNextStep() {
        feedbackOverlay.classList.remove('show');
        currentStep++;
        loadStep();
    }

    // 모든 시나리오 종료 후 결과 화면
    function showFinalResult() {
        stageMsgEl.textContent = "시뮬레이션 완료!";
        stageMsgEl.classList.add('pulse');
        instructionEl.innerHTML = `수고하셨습니다!<br>심폐소생술의 모든 단계를 훌륭하게 수행했습니다.`;
        
        choicesContainer.innerHTML = `
            <div style="text-align:center; padding: 20px;">
                <h2 style="color:var(--primary-color); margin-bottom: 10px;">당신은 생명을 살리는 영웅입니다!</h2>
                <p style="color:var(--text-sub); line-height: 1.5; margin-bottom: 20px;">
                    이제 실제 마네킹 실습에서도 자신 있게 해낼 수 있습니다.<br>
                    기억하세요! <b>의식확인 ➔ 119신고 ➔ 30:2 가슴압박 ➔ AED사용</b>
                </p>
                <button class="next-btn" onclick="location.reload()" style="width:100%;">처음부터 다시 연습하기</button>
            </div>
        `;
    }

    // 초기 화면 로드
    window.onload = loadStep;

</script>
</body>
</html>
